plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id 'com.matthewprenger.cursegradle' version '1.5.0-SNAPSHOT'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "com.modrinth.minotaur"
    apply plugin: "com.matthewprenger.cursegradle"

    repositories {
        maven { url "https://maven.pitan76.net/" }
    }


    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        api "net.pitan76:mcpitanlib-fabric-${rootProject.mcpitanlib_version}"
    }


    if (name in "fabric".split(",")) {
        var modLoader = name

        if (System.getenv("CURSEFORGE_TOKEN") != null) {
            curseforge {
                apiKey = System.getenv("CURSEFORGE_TOKEN")
                project {
                    id = '971077'
                    changelog = rootProject.changelog + "\nMCPitanLib: " + rootProject.mcpitanlib_version.split(":")[1]
                    if (modLoader == "fabric") {
                        releaseType = 'release'
                        addGameVersion "Fabric"
                    }
                    if (modLoader == "forge") {
                        releaseType = 'beta'
                        addGameVersion "Forge"
                    }

                    addGameVersion '26.1'
                    addGameVersion '26.1.1'
                    addGameVersion '26.1.2'

                    relations {
                        if (modLoader == "fabric") {
                            requiredDependency "fabric-api"
                        }
                        requiredDependency 'mcpitanlibarch'
                    }

                    mainArtifact(tasks.jar)
                }
                options {
                    forgeGradleIntegration = false
                }
            }

        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                projectId = '9MhQ9NoM'
                versionNumber = project.mod_version + "-" + modLoader

                gameVersions.addAll(['26.1', '26.1.1', '26.1.2'])

                versionType = 'release'
                uploadFile = tasks.jar
                changelog = rootProject.changelog
                loaders = [modLoader]
                dependencies {
                    if (modLoader == "fabric") {
                        required.project "P7dR8mSH" // Fabric API
                    }
                    required.project "uNRoUnGT" // MCPitanLib
                }
            }
        }
    }


}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = rootProject.archives_base_name
    mod_name = rootProject.mod_name
    mod_id = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }
}
